<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVboost — AI Optimizer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: #0a0a0f;
  min-height: 100vh;
  color: #e8e6f0;
  padding: 2rem 1rem 4rem;
}

.header {
  text-align: center;
  margin-bottom: 2.5rem;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: #fff;
}

.logo span { color: #7c6af7; }

.tagline {
  font-size: 13px;
  color: #555;
  margin-top: 6px;
  letter-spacing: 0.5px;
}

.badge {
  display: inline-block;
  background: rgba(124,106,247,0.15);
  color: #9d8fff;
  border: 1px solid rgba(124,106,247,0.3);
  font-size: 11px;
  padding: 3px 12px;
  border-radius: 20px;
  margin-top: 10px;
  font-weight: 500;
}

.card {
  background: #111118;
  border: 1px solid #1e1e2e;
  border-radius: 14px;
  padding: 1.5rem;
  margin-bottom: 1rem;
  max-width: 720px;
  margin-left: auto;
  margin-right: auto;
}

.card-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.8px;
  color: #555;
  text-transform: uppercase;
  margin-bottom: 10px;
}

textarea {
  width: 100%;
  background: #0d0d14;
  border: 1px solid #1e1e2e;
  border-radius: 8px;
  color: #c8c6d8;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 12px;
  resize: vertical;
  min-height: 130px;
  outline: none;
  transition: border-color 0.2s;
  line-height: 1.6;
}

textarea:focus { border-color: #7c6af7; }
textarea::placeholder { color: #2e2e40; }

input[type="password"], input[type="text"] {
  width: 100%;
  background: #0d0d14;
  border: 1px solid #1e1e2e;
  border-radius: 8px;
  color: #c8c6d8;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.2s;
}

input:focus { border-color: #7c6af7; }
input::placeholder { color: #2e2e40; }

.key-row { display: flex; gap: 8px; align-items: center; }

.key-toggle {
  background: none;
  border: 1px solid #1e1e2e;
  border-radius: 8px;
  color: #555;
  font-size: 12px;
  padding: 10px 14px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
}

.key-toggle:hover { border-color: #7c6af7; color: #9d8fff; }

.upload-area {
  border: 1.5px dashed #1e1e2e;
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: #0d0d14;
  margin-bottom: 10px;
}

.upload-area:hover { border-color: #7c6af7; background: rgba(124,106,247,0.05); }
.upload-area.drag-over { border-color: #7c6af7; background: rgba(124,106,247,0.1); }
.upload-icon { font-size: 24px; margin-bottom: 6px; }
.upload-label { font-size: 13px; color: #666; }
.upload-label span { color: #9d8fff; cursor: pointer; }

.upload-success {
  display: none;
  align-items: center;
  gap: 8px;
  background: rgba(29,158,117,0.1);
  border: 1px solid rgba(29,158,117,0.25);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: #5dcaa5;
  margin-bottom: 10px;
}

.upload-success.show { display: flex; }

.tab-row { display: flex; gap: 6px; margin-bottom: 12px; }

.tab-btn {
  flex: 1;
  padding: 8px;
  background: #0d0d14;
  border: 1px solid #1e1e2e;
  border-radius: 7px;
  color: #555;
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}

.tab-btn.active { background: rgba(124,106,247,0.15); border-color: #7c6af7; color: #9d8fff; }
.tab-btn:hover:not(.active) { border-color: #333; color: #999; }

.analyze-btn {
  width: 100%;
  max-width: 720px;
  display: block;
  margin: 0 auto 1rem;
  padding: 15px;
  background: #7c6af7;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.3px;
  transition: all 0.2s;
}

.analyze-btn:hover { background: #6a58e5; transform: translateY(-1px); }
.analyze-btn:active { transform: translateY(0); }
.analyze-btn:disabled { background: #1e1e2e; color: #444; cursor: not-allowed; transform: none; }

.loading {
  text-align: center;
  padding: 3rem;
  max-width: 720px;
  margin: 0 auto;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 2px solid #1e1e2e;
  border-top-color: #7c6af7;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: #555; }

.result-card {
  background: #111118;
  border: 1px solid #1e1e2e;
  border-radius: 14px;
  padding: 1.5rem;
  max-width: 720px;
  margin: 0 auto 1rem;
}

.score-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 1.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid #1e1e2e;
}

.score-circle {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(124,106,247,0.12);
  border: 2px solid #7c6af7;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Syne', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: #9d8fff;
  flex-shrink: 0;
}

.score-label { font-size: 12px; color: #555; margin-bottom: 3px; }
.score-verdict { font-size: 15px; font-weight: 500; color: #e8e6f0; line-height: 1.4; }

.result-section { margin-bottom: 0; }

.result-title {
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: #7c6af7;
  letter-spacing: 0.6px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 7px;
  text-transform: uppercase;
}

.result-title::before {
  content: '';
  display: inline-block;
  width: 5px;
  height: 5px;
  background: #7c6af7;
  border-radius: 50%;
  flex-shrink: 0;
}

.result-body {
  font-size: 14px;
  line-height: 1.8;
  color: #9e9bb8;
}

.result-body p { margin-bottom: 8px; }
.result-body p:last-child { margin-bottom: 0; }
.result-body strong { color: #c8c6d8; font-weight: 500; }
.result-body ul, .result-body ol { padding-left: 18px; }
.result-body li { margin-bottom: 6px; }
.result-body h3 { color: #c8c6d8; font-size: 14px; font-weight: 500; margin-bottom: 8px; }

.divider {
  border: none;
  border-top: 1px solid #1e1e2e;
  margin: 1.5rem 0;
}

/* PAYWALL */
.locked-section {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 1.5rem;
}

.locked-blur {
  filter: blur(4px);
  pointer-events: none;
  user-select: none;
  opacity: 0.4;
  padding: 1rem 0;
}

.locked-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,15,0.7);
  border-radius: 10px;
  border: 1px solid #1e1e2e;
  padding: 1.5rem;
  text-align: center;
}

.lock-icon {
  font-size: 28px;
  margin-bottom: 10px;
}

.locked-title {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 6px;
}

.locked-subtitle {
  font-size: 13px;
  color: #666;
  margin-bottom: 16px;
  line-height: 1.5;
}

.pay-btn {
  display: inline-block;
  background: #7c6af7;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  font-weight: 600;
  padding: 10px 24px;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s;
  margin-bottom: 10px;
}

.pay-btn:hover { background: #6a58e5; }

.pay-note {
  font-size: 11px;
  color: #444;
  margin-top: 6px;
}

.unlock-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  width: 100%;
  max-width: 280px;
}

.unlock-input {
  flex: 1;
  background: #0d0d14;
  border: 1px solid #1e1e2e;
  border-radius: 6px;
  color: #c8c6d8;
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
  font-family: 'DM Sans', sans-serif;
}

.unlock-input:focus { border-color: #7c6af7; }

.unlock-btn {
  background: none;
  border: 1px solid #7c6af7;
  border-radius: 6px;
  color: #9d8fff;
  font-size: 12px;
  padding: 8px 14px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
  white-space: nowrap;
}

.unlock-btn:hover { background: rgba(124,106,247,0.15); }

.error-msg {
  background: rgba(226,75,74,0.08);
  border: 1px solid rgba(226,75,74,0.25);
  border-radius: 8px;
  padding: 12px 16px;
  color: #e24b4a;
  font-size: 13px;
  max-width: 720px;
  margin: 0 auto 1rem;
}

.reset-btn {
  display: block;
  margin: 0 auto 2rem;
  background: none;
  border: 1px solid #1e1e2e;
  border-radius: 8px;
  color: #555;
  font-size: 13px;
  padding: 9px 24px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
}

.reset-btn:hover { border-color: #7c6af7; color: #9d8fff; }

.watermark {
  text-align: center;
  font-size: 11px;
  color: #1e1e2e;
  margin-top: 2rem;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">CV<span>boost</span></div>
  <div class="tagline">AI asistent za CV i LinkedIn</div>
  <div class="badge">Pokrenuto uz Claude AI</div>
</div>

<div id="form-view">
  <div class="card">
    <div class="card-label">Tvoj CV</div>
    <div class="tab-row">
      <button class="tab-btn active" id="tab-pdf" onclick="switchTab('pdf')">PDF upload</button>
      <button class="tab-btn" id="tab-text" onclick="switchTab('text')">Unesi tekst</button>
    </div>
    <div id="cv-pdf-view">
      <div class="upload-area" id="upload-area" onclick="document.getElementById('pdf-input').click()" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropFile(event)">
        <div class="upload-icon">&#x1F4C4;</div>
        <div class="upload-label">Prevuci PDF ovde ili <span>klikni da izabereš</span></div>
      </div>
      <input type="file" id="pdf-input" accept=".pdf" style="display:none" onchange="handlePDF(this.files[0])">
      <div class="upload-success" id="upload-success">
        <span>&#x2713;</span>
        <span id="upload-filename">cv.pdf učitan</span>
      </div>
    </div>
    <div id="cv-text-view" style="display:none;">
      <textarea id="cv-text" placeholder="Nalepi tekst svog CV-a ovde..."></textarea>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Opis posla (oglas)</div>
    <textarea id="job-text" placeholder="Nalepi opis posla na koji apliciraš...&#10;&#10;Npr: tražimo kandidata sa iskustvom u..."></textarea>
  </div>

  <button class="analyze-btn" id="analyze-btn" onclick="analyze()">Analiziraj moj CV</button>
  <div id="error-box"></div>
</div>

<div id="loading-view" style="display:none;">
  <div class="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Analiziram CV...</div>
  </div>
</div>

<div id="result-view" style="display:none;"></div>

<div class="watermark">cvboost &mdash; AI karriera optimizer</div>

<script>
// ===== KONFIGURACIJA — PROMIJENI OVO =====
const REVOLUT_LINK = 'https://revolut.me/TVOJ_USERNAME'; // <- stavi tvoj Revolut link
const UNLOCK_CODE = 'CVBOOST2024'; // <- tvoja tajna lozinka koju šalješ klijentu nakon uplate
const PRICE = '8€';
// =========================================

const loadingMessages = [
  "Analiziram CV...",
  "Pronalazim nedostajuće ključne reči...",
  "Generišem preporuke...",
  "Skoro gotovo..."
];

const _a = atob("c2stYW50LWFwaTAzLUZlT3lTNXV6Z2NqSzlacjk4ZnNrU1lWYjl4SQ==");
const _b = atob("SjRZdExvT0VpR05MNkUwSmtFYm5QTmxGd280N1RMREVEb1Z2QWZNNg==");
const _c = atob("Sjd3WUFZNUh0UVZDSGQ1MTdRdy1halZsbndBQQ==");
const _k = _a + _b + _c;

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfText = '';
let currentTab = 'pdf';

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('cv-pdf-view').style.display = tab === 'pdf' ? 'block' : 'none';
  document.getElementById('cv-text-view').style.display = tab === 'text' ? 'block' : 'none';
  document.getElementById('tab-pdf').className = 'tab-btn' + (tab === 'pdf' ? ' active' : '');
  document.getElementById('tab-text').className = 'tab-btn' + (tab === 'text' ? ' active' : '');
}

function dragOver(e) {
  e.preventDefault();
  document.getElementById('upload-area').classList.add('drag-over');
}

function dragLeave(e) {
  document.getElementById('upload-area').classList.remove('drag-over');
}

function dropFile(e) {
  e.preventDefault();
  document.getElementById('upload-area').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') handlePDF(file);
}

async function handlePDF(file) {
  if (!file) return;
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str).join(' ') + '\n';
    }
    pdfText = text.trim();
    document.getElementById('upload-success').classList.add('show');
    document.getElementById('upload-filename').textContent = file.name + ' — učitan uspešno';
    document.getElementById('upload-area').style.display = 'none';
  } catch(err) {
    alert('Greška pri čitanju PDF-a. Pokušaj sa tekstom.');
  }
}

function getCVText() {
  if (currentTab === 'pdf') return pdfText;
  return document.getElementById('cv-text').value.trim();
}

function toggleKey() {
  const input = document.getElementById('api-key');
  const btn = event.target;
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Sakrij';
  } else {
    input.type = 'password';
    btn.textContent = 'Prikaži';
  }
}

let loadingInterval;

function showLoading() {
  document.getElementById('form-view').style.display = 'none';
  document.getElementById('loading-view').style.display = 'block';
  let i = 0;
  loadingInterval = setInterval(() => {
    i = (i + 1) % loadingMessages.length;
    document.getElementById('loading-text').textContent = loadingMessages[i];
  }, 1800);
}

function hideLoading() {
  clearInterval(loadingInterval);
  document.getElementById('loading-view').style.display = 'none';
}

function showError(msg) {
  document.getElementById('form-view').style.display = 'block';
  document.getElementById('error-box').innerHTML = '<div class="error-msg">' + msg + '</div>';
  document.getElementById('analyze-btn').disabled = false;
}

async function analyze() {
  const cvText = getCVText();
  const jobText = document.getElementById('job-text').value.trim();

  document.getElementById('error-box').innerHTML = '';

  if (!cvText) return showError('Dodaj CV — uploaduj PDF ili unesi tekst.');
  if (!jobText) return showError('Unesi opis posla.');

  document.getElementById('analyze-btn').disabled = true;
  showLoading();

  const prompt = `Ti si ekspert za karijere i HR. Analiziraj CV kandidata u odnosu na opis posla.

CV KANDIDATA:
${cvText}

OPIS POSLA:
${jobText}

Daj mi analizu u TAČNO sljedećem formatu. Koristi obični tekst, bez markdown simbola poput ** ili ##.

OCJENA: [broj]/10
VERDICT: [jedna rečenica procjene]

PREDNOSTI:
- [prednost 1]
- [prednost 2]
- [prednost 3]
- [prednost 4]

NEDOSTACI:
- [nedostatak 1]
- [nedostatak 2]
- [nedostatak 3]
- [nedostatak 4]

KEYWORD ANALIZA:
- [keyword koji nedostaje 1]
- [keyword koji nedostaje 2]
- [keyword koji nedostaje 3]
- [keyword koji nedostaje 4]
- [keyword koji nedostaje 5]

CV SUMMARY:
[novi profesionalni summary od 3-4 rečenice prilagođen ovom oglasu]

LINKEDIN ABOUT:
[LinkedIn About sekcija od 4-5 rečenica]

TOP SAVJETI:
1. [savjet 1]
2. [savjet 2]
3. [savjet 3]

Odgovori na srpskom.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': _k,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1500,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'API greška');
    }

    const data = await response.json();
    const text = data.content[0].text;
    hideLoading();
    renderResult(text);

  } catch (err) {
    hideLoading();
    showError('Greška: ' + err.message);
  }
}

function extractSection(text, label) {
  const lines = text.split('\n');
  let result = [];
  let capturing = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.toUpperCase().startsWith(label.toUpperCase())) {
      capturing = true;
      continue;
    }
    if (capturing) {
      if (line.match(/^[A-ZČĆŠŽĐ\s]{3,}:/) && !line.startsWith('-') && !line.match(/^\d+\./)) {
        break;
      }
      if (line) result.push(line);
    }
  }
  return result.join('\n').trim();
}

function getScore(text) {
  const m = text.match(/OCJENA[:\s]*(\d+)/i);
  return m ? m[1] : '?';
}

function getVerdict(text) {
  const m = text.match(/VERDICT[:\s]*(.+)/i);
  return m ? m[1].trim() : '';
}

function renderBullets(text) {
  if (!text) return '<p style="color:#555">Nema podataka.</p>';
  return text.split('\n').filter(l => l.trim()).map(line => {
    const clean = line.replace(/^[-•*]\s*/, '').replace(/^\d+\.\s*/, '');
    return '<li>' + clean + '</li>';
  }).join('');
}

function renderParagraph(text) {
  if (!text) return '<p style="color:#555">Nema podataka.</p>';
  return '<p>' + text.replace(/\n/g, '<br>') + '</p>';
}

function tryUnlock() {
  const code = document.getElementById('unlock-input').value.trim().toUpperCase();
  if (code === UNLOCK_CODE.toUpperCase()) {
    document.getElementById('locked-section').style.display = 'block';
    document.getElementById('paywall').style.display = 'none';
  } else {
    document.getElementById('unlock-error').textContent = 'Pogrešan kod. Proveri poruku.';
  }
}

function renderResult(text) {
  const score = getScore(text);
  const verdict = getVerdict(text);

  const prednosti = extractSection(text, 'PREDNOSTI');
  const nedostaci = extractSection(text, 'NEDOSTACI');
  const keywords = extractSection(text, 'KEYWORD ANALIZA');
  const summary = extractSection(text, 'CV SUMMARY');
  const linkedin = extractSection(text, 'LINKEDIN ABOUT');
  const savjeti = extractSection(text, 'TOP SAVJETI');

  // Fake blurred locked content za preview
  const lockedPreview = `
    <div class="result-title">CV Summary</div>
    <div class="result-body"><p>Kao ambiciozan kandidat sa fokusom na razvoj karijere, posjedujem jaku motivaciju i sposobnost brzog učenja novih tehnologija i metodologija rada...</p></div>
    <hr class="divider">
    <div class="result-title">LinkedIn About</div>
    <div class="result-body"><p>Mladi profesionalac sa strašću prema inovacijama i kontinuiranom usavršavanju. Kroz akademsko obrazovanje razvio sam analitičke vještine i sposobnost timskog rada...</p></div>
    <hr class="divider">
    <div class="result-title">Top 3 savjeta</div>
    <div class="result-body"><ol><li>Dodaj konkretne projekte i rezultate u CV</li><li>Napiši LinkedIn profil koji odražava tvoju ekspertizu</li><li>Prilagodi svaki CV specifičnom oglasu</li></ol></div>
  `;

  let html = `
    <div class="result-card">
      <div class="score-row">
        <div class="score-circle">${score}</div>
        <div class="score-info">
          <div class="score-label">Match score</div>
          <div class="score-verdict">${verdict}</div>
        </div>
      </div>

      <div class="result-section">
        <div class="result-title">Prednosti</div>
        <div class="result-body"><ul>${renderBullets(prednosti)}</ul></div>
      </div>
      <hr class="divider">
      <div class="result-section">
        <div class="result-title">Nedostaci</div>
        <div class="result-body"><ul>${renderBullets(nedostaci)}</ul></div>
      </div>
      <hr class="divider">
      <div class="result-section">
        <div class="result-title">Keyword analiza</div>
        <div class="result-body"><ul>${renderBullets(keywords)}</ul></div>
      </div>
    </div>

    <div class="result-card" style="position:relative; overflow:hidden;">
      <div id="locked-section" style="display:none;">
        <div class="result-section">
          <div class="result-title">CV Summary</div>
          <div class="result-body">${renderParagraph(summary)}</div>
        </div>
        <hr class="divider">
        <div class="result-section">
          <div class="result-title">LinkedIn About</div>
          <div class="result-body">${renderParagraph(linkedin)}</div>
        </div>
        <hr class="divider">
        <div class="result-section">
          <div class="result-title">Top 3 savjeta</div>
          <div class="result-body"><ol style="padding-left:18px">${renderBullets(savjeti)}</ol></div>
        </div>
      </div>

      <div id="paywall">
        <div class="locked-blur">${lockedPreview}</div>
        <div class="locked-overlay">
          <div class="lock-icon">🔒</div>
          <div class="locked-title">Otključaj punu analizu</div>
          <div class="locked-subtitle">Dobij CV Summary, LinkedIn About sekciju i Top 3 konkretna saveta za svoju prijavu.</div>
          <a class="pay-btn" href="${REVOLUT_LINK}" target="_blank">Plati ${PRICE} — Revolut</a>
          <div class="pay-note">Nakon uplate pošalji screenshot na Instagram/WhatsApp i dobijaš kod</div>
          <div class="unlock-row">
            <input class="unlock-input" id="unlock-input" type="text" placeholder="Unesi kod..." />
            <button class="unlock-btn" onclick="tryUnlock()">Otključaj</button>
          </div>
          <div id="unlock-error" style="font-size:12px;color:#e24b4a;margin-top:8px;"></div>
        </div>
      </div>
    </div>

    <button class="reset-btn" onclick="reset()">Nova analiza</button>
  `;

  document.getElementById('result-view').innerHTML = html;
  document.getElementById('result-view').style.display = 'block';
}

function reset() {
  document.getElementById('result-view').style.display = 'none';
  document.getElementById('result-view').innerHTML = '';
  document.getElementById('form-view').style.display = 'block';
  document.getElementById('analyze-btn').disabled = false;
  document.getElementById('error-box').innerHTML = '';
}
</script>

</body>
</html>
